$schema: https://json-schema.org/draft/2020-12/schema
$id: agentic-flow-builder/flow-map.schema.yaml
title: Agentic Flow Builder - Flow Map
description: 'Defines the current automation knowledge for one independently executable Playwright business flow.

  '
type: object
additionalProperties: false
required:
- flow
properties:
  flow:
    type: object
    additionalProperties: false
    required:
    - steps
    - metadata
    - execution
    - data
    - test_cases
    - elements
    - assertions
    - verification
    - project
    properties:
      steps:
        type: array
        minItems: 1
        items:
          type: object
          additionalProperties: false
          required:
          - id
          - name
          properties:
            id:
              type: string
              pattern: ^STEP-[A-Za-z0-9_-]+$
            name:
              type: string
              minLength: 1
            description:
              type: string
            module:
              type: string
            optional:
              type: boolean
              default: false
      metadata:
        type: object
        additionalProperties: false
        required:
        - id
        - name
        - description
        - type
        - status
        - revision
        - created_at
        - updated_at
        properties:
          id:
            $ref: '#/$defs/flowId'
          name:
            type: string
            minLength: 1
          description:
            type: string
            minLength: 1
          module:
            type:
            - string
            - 'null'
          type:
            type: string
            enum:
            - e2e
            - functional
            - regression
            - workflow
            - mixed
          status:
            $ref: '#/$defs/mapStatus'
          revision:
            type: integer
            minimum: 1
          created_at:
            $ref: '#/$defs/dateTime'
          updated_at:
            $ref: '#/$defs/dateTime'
          tags:
            type: array
            uniqueItems: true
            items:
              type: string
      execution:
        type: object
        additionalProperties: false
        required:
        - auth
        properties:
          start_url:
            type:
            - string
            - 'null'
          role:
            type:
            - string
            - 'null'
          auth:
            type: object
            additionalProperties: false
            required:
            - mode
            - isolation
            properties:
              mode:
                type: string
                enum:
                - inline
                - flow_scoped_shared
                - none
              user_data_ref:
                type:
                - string
                - 'null'
              isolation:
                type: object
                additionalProperties: false
                required:
                - cross_flow_session_reuse
                properties:
                  cross_flow_session_reuse:
                    const: false
          timeout_profile:
            type:
            - string
            - 'null'
            description: 'Optional project-defined timeout profile. Must not be used to introduce arbitrary fixed
              waits.

              '
      data:
        type: object
        additionalProperties: false
        required:
        - sources
        properties:
          sources:
            type: array
            items:
              type: object
              additionalProperties: false
              required:
              - id
              - ref
              properties:
                id:
                  type: string
                  minLength: 1
                ref:
                  type: string
                  minLength: 1
                description:
                  type: string
                run_scoped:
                  type: boolean
                  default: false
      test_cases:
        type: array
        minItems: 1
        items:
          type: object
          additionalProperties: false
          required:
          - id
          - name
          - steps
          - expected_result
          properties:
            id:
              $ref: '#/$defs/testCaseId'
            name:
              type: string
              minLength: 1
            description:
              type: string
            steps:
              oneOf:
              - type: object
                additionalProperties: false
                required:
                - from
                - to
                properties:
                  from:
                    type: string
                  to:
                    type: string
              - type: array
                minItems: 1
                items:
                  type: string
            data:
              type: object
              additionalProperties: false
              properties:
                ref:
                  type: string
                refs:
                  type: array
                  uniqueItems: true
                  items:
                    type: string
            expected_result: {}
            preconditions:
              type: array
              items:
                type: string
            depends_on:
              type: array
              uniqueItems: true
              items:
                $ref: '#/$defs/testCaseId'
            tags:
              type: array
              uniqueItems: true
              items:
                type: string
      elements:
        type: object
        minProperties: 1
        additionalProperties:
          $ref: '#/$defs/elementDefinition'
      assertions:
        type: object
        additionalProperties:
          $ref: '#/$defs/assertionDefinition'
      verification:
        type: object
        additionalProperties: false
        required:
        - required_strategies
        - current_revision
        - verified_revision
        - latest_runs
        properties:
          required_strategies:
            type: object
            additionalProperties: false
            required:
            - primary
            - fallback
            - last_resort
            properties:
              primary:
                $ref: '#/$defs/verificationRequirement'
              fallback:
                $ref: '#/$defs/verificationRequirement'
              last_resort:
                $ref: '#/$defs/verificationRequirement'
          current_revision:
            type: integer
            minimum: 1
          verified_revision:
            type:
            - integer
            - 'null'
            minimum: 1
          latest_runs:
            type: object
            additionalProperties: false
            required:
            - primary
            - fallback
            - last_resort
            properties:
              primary:
                $ref: '#/$defs/nullableRunRef'
              fallback:
                $ref: '#/$defs/nullableRunRef'
              last_resort:
                $ref: '#/$defs/nullableRunRef'
          revalidation_reason:
            type:
            - object
            - 'null'
            properties:
              type:
                type: string
              element:
                type: string
              changed:
                type: array
                items:
                  type: string
              detected_at:
                $ref: '#/$defs/dateTime'
      project:
        type: object
        additionalProperties: false
        required:
        - evidence
        properties:
          data_root:
            type:
            - string
            - 'null'
          evidence_root:
            type:
            - string
            - 'null'
          evidence:
            type: object
            additionalProperties: false
            required:
            - capture_on_pass
            - capture_on_failure
            - screenshot_on_failure
            - trace_on_failure
            properties:
              capture_on_pass:
                const: false
              capture_on_failure:
                type: boolean
              screenshot_on_failure:
                type: boolean
              trace_on_failure:
                type: boolean
      agent_notes:
        type: array
        items:
          type: string
      change_reason:
        type:
        - object
        - 'null'
        properties:
          type:
            type: string
          source_run:
            type: string
          affected_element:
            type: string
          previous_revision:
            type: integer
            minimum: 1
          description:
            type: string
        additionalProperties: false
$defs:
  flowId:
    type: string
    minLength: 1
    pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
  testCaseId:
    type: string
    minLength: 1
  dateTime:
    type: string
    format: date-time
  mapStatus:
    type: string
    enum:
    - drafted
    - primary_validated
    - fallback_validated
    - verified
    - degraded
    - degraded_critical
    - broken
    - revalidation_required
  locatorValidationStatus:
    type: string
    enum:
    - pending
    - validated
    - failed
  locatorQuality:
    type: string
    enum:
    - high
    - medium
    - low
    - brittle
  locatorStrategy:
    type: string
    enum:
    - test_id
    - role
    - label
    - scoped
    - placeholder
    - text
    - alt_text
    - attribute
    - css
    - xpath
    - nth
  locatorDefinition:
    type: object
    additionalProperties: false
    required:
    - strategy
    - value
    - quality
    - validation_status
    properties:
      strategy:
        $ref: '#/$defs/locatorStrategy'
      value:
        type: object
        minProperties: 1
      quality:
        $ref: '#/$defs/locatorQuality'
      validation_status:
        $ref: '#/$defs/locatorValidationStatus'
      notes:
        type: string
  targetContract:
    type: object
    additionalProperties: false
    minProperties: 1
    properties:
      role:
        type: string
      accessible_name:
        type: string
      label:
        type: string
      tag:
        type: string
      input_type:
        type: string
      expected_text:
        type: string
      container:
        type: string
      unique:
        type: boolean
      editable:
        type: boolean
  knowledgeSource:
    type: object
    additionalProperties: false
    required:
    - type
    properties:
      type:
        type: string
        enum:
        - discovered
        - reused
      from_flow:
        type: string
      from_element:
        type: string
      source_revision:
        type: integer
        minimum: 1
  interactionDefinition:
    type: object
    additionalProperties: false
    required:
    - preferred
    properties:
      preferred:
        $ref: '#/$defs/interactionMethod'
      alternatives:
        type: array
        items:
          $ref: '#/$defs/interactionAlternative'
  interactionMethod:
    type: object
    additionalProperties: false
    required:
    - method
    properties:
      method:
        type: string
        enum:
        - click
        - fill
        - clear
        - check
        - uncheck
        - selectOption
        - setInputFiles
        - press
        - pressSequentially
        - hover
        - dragTo
      data_ref:
        type: string
      key:
        type: string
      target_element:
        type: string
      value: {}
      options:
        type: object
  expectedState:
    type: object
    additionalProperties: false
    properties:
      after_action:
        type: object
        additionalProperties: false
        properties:
          assertions:
            type: array
            uniqueItems: true
            items:
              type: string
  elementDefinition:
    type: object
    additionalProperties: false
    required:
    - description
    - used_in
    - knowledge_source
    - target_contract
    - locators
    - interaction
    properties:
      description:
        type: string
        minLength: 1
      used_in:
        type: array
        minItems: 1
        uniqueItems: true
        items:
          type: string
      knowledge_source:
        $ref: '#/$defs/knowledgeSource'
      target_contract:
        $ref: '#/$defs/targetContract'
      locators:
        type: object
        additionalProperties: false
        required:
        - primary
        - fallback
        - last_resort
        properties:
          primary:
            $ref: '#/$defs/locatorDefinition'
          fallback:
            $ref: '#/$defs/locatorDefinition'
          last_resort:
            $ref: '#/$defs/locatorDefinition'
      interaction:
        $ref: '#/$defs/interactionDefinition'
      expected_state:
        $ref: '#/$defs/expectedState'
  assertionDefinition:
    type: object
    additionalProperties: false
    required:
    - type
    - target
    - expected
    properties:
      after_step:
        type: string
      type:
        type: string
        enum:
        - visible
        - hidden
        - enabled
        - disabled
        - text
        - value
        - checked
        - count
        - url
        - business_state
      target:
        type: object
        additionalProperties: false
        properties:
          element:
            type: string
          locator:
            type: object
            additionalProperties: false
            required:
            - strategy
            - value
            properties:
              strategy:
                $ref: '#/$defs/locatorStrategy'
              value:
                type: object
                minProperties: 1
        oneOf:
        - required:
          - element
          not:
            required:
            - locator
        - required:
          - locator
          not:
            required:
            - element
      expected: {}
      business_critical:
        type: boolean
        default: false
  verificationRequirement:
    type: object
    additionalProperties: false
    required:
    - required
    properties:
      required:
        type: boolean
  nullableRunRef:
    oneOf:
    - type: 'null'
    - type: object
      additionalProperties: false
      required:
      - run_id
      - result
      properties:
        run_id:
          type: string
        result:
          $ref: '#/$defs/runResult'
        map_revision:
          type: integer
          minimum: 1
  interactionAlternative:
    type: object
    additionalProperties: false
    required:
    - method
    - automatic_fallback
    properties:
      method:
        type: string
        enum:
        - click
        - fill
        - clear
        - check
        - uncheck
        - selectOption
        - setInputFiles
        - press
        - pressSequentially
        - hover
        - dragTo
      data_ref:
        type: string
      key:
        type: string
      target_element:
        type: string
      value: {}
      options:
        type: object
      allowed_when:
        type: array
        items:
          type: string
      automatic_fallback:
        const: false
  runResult:
    type: string
    enum:
    - passed
    - passed_with_recovery
    - partial_failed
    - partial_blocked
    - failed
    - blocked
$comment: Runtime semantic validation additionally enforces revision equality, verified_revision rules, cross-flow
  session isolation, reference integrity, locator target equivalence, secret exclusion, and revalidation on automation-definition
  changes.
